<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物理シミュレーター</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>⚛ 物理シミュレーター</h1>
    <div class="control">
      <label for="preset">シーン</label>
      <select id="preset"></select>
    </div>
    <button id="pauseBtn">⏸ 一時停止</button>
    <button id="stepBtn" title="一時停止中に1コマ進める">⏭ コマ送り</button>
    <button id="resetBtn">↺ リセット</button>
    <div class="control">
      <label for="gravity">重力</label>
      <input type="range" id="gravity" min="0" max="2000" step="10" value="500">
      <output id="gravityValue">500</output>
    </div>
    <div class="control">
      <label for="restitution">反発係数</label>
      <input type="range" id="restitution" min="-0.01" max="1" step="0.01" value="-0.01">
      <output id="restitutionValue">自動</output>
    </div>
    <div class="control">
      <label for="timeScale">速度</label>
      <input type="range" id="timeScale" min="0.1" max="3" step="0.1" value="1">
      <output id="timeScaleValue">1.0x</output>
    </div>
  </header>

  <main>
    <canvas id="canvas"></canvas>
  </main>

  <footer>
    <span id="description"></span>
    <span id="stats"></span>
  </footer>

  <script src="js/physics.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
